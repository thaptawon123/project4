services:
  frontend:
    build: .
    ports:
      - "8080:80"
    restart: unless-stopped
    container_name: campus-nutrition-analyzer
    depends_on:
      - backend

  backend:
    build: ./backend
    expose:
      - "3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://nutrition:nutrition@db:5432/nutrition
    restart: unless-stopped
    container_name: campus-nutrition-backend
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nutrition
      POSTGRES_USER: nutrition
      POSTGRES_PASSWORD: nutrition
    volumes:
      - nutrition-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutrition -d nutrition"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    container_name: campus-nutrition-db

volumes:
  nutrition-data:
