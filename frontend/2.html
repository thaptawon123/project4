<span class="material-symbols-outlined text-primary" data-icon="arrow_back" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</a>
<div class="liquid-card px-container-padding py-base flex-1 flex items-center justify-between">

<!-- Menu Grid -->

<script>
    const restaurantData = {
      'pra-daeng': {
        name: 'ร้านกะเพราป้าแดง',
        location: 'โรงอาหารกลาง',
        type: 'อาหารตามสั่ง'
      },
      'green-bowl': {
        name: 'Green Bowl Salad',
        location: 'ตึกวิทยาศาสตร์',
        type: 'อาหารเพื่อสุขภาพ'
      },
      'noodle-boat': {
        name: 'เตี๋ยวเรือรสเด็ด',
        location: 'อาคารเรียนรวม',
        type: 'ก๋วยเตี๋ยว'
      },
      'caffeine-lab': {
        name: 'Caffeine Lab',
        location: 'ห้องสมุด',
        type: 'เครื่องดื่ม / คาเฟ่'
      }
    };

    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      const restaurantId = params.get('restaurant') || 'pra-daeng';
      const restaurant = JSON.parse(localStorage.getItem('selectedRestaurant') || '{}');

      if (restaurant.id) {
        document.querySelector('header .liquid-card h1').textContent = restaurant.name;
        document.querySelector('header .liquid-card span').textContent = restaurant.location;
      }

      // Restaurant menu mapping
      const restaurantMenus = {
        'pra-daeng': ['krapow-gai-khai-dao', 'omelet-pork', 'tom-yum-goong', 'khao-pad-moo'],
        'green-bowl': ['green-bowl-salad', 'quinoa-bowl', 'fruit-salad'],
        'noodle-boat': ['boat-noodle', 'yen-ta-fo', 'tom-yum-noodle'],
        'central-cafe': ['pad-thai', 'khao-khaeng-moo', 'sushi-set'],
        'science-cafe': ['caesar-salad', 'fruit-smoothie', 'grilled-chicken-salad'],
        'academic-cafe': ['khao-klook-kapi', 'spaghetti-carbonara', 'fried-chicken-rice'],
        'caffeine-lab': ['iced-latte', 'matcha-latte', 'cold-brew']
      };

      // Dish data (same as 3.html)
      const dishData = {
        'krapow-gai-khai-dao': {
          name: 'ข้าวกะเพราไก่ไข่ดาว',
          price: '50 THB',
          kcal: 520,
          image: 'https://lh3.googleusercontent.com/aida-public/AB6AXuA21-1rhJ-s_t71kgkRlNEYBN9bhkciDrBqqGUCH2xZsMPUl4yCo2095J4RXDjqiuTak19ztGcNyU-fH3KiVNM19crNsm1iXXpLHYYHEXrM_HHbspltKb69I3mWWJw-Md_TB9rJXbFWwWSv_NIX8rfrxRC4EeGXXSs0C3FVWs8Jy44oEi4w1ykTX460fibgYeu56QpOsSaVvLU5r0RdLB-YiXa94zcF261v-TWepE2Y5LbCaYSNJq5E'
        },
        'pad-thai': {
          name: 'ผัดไทย',
          price: '50 THB',
          kcal: 480,
          image: 'https://via.placeholder.com/400x300?text=Pad+Thai'
        },
        'khao-khaeng-moo': {
          name: 'ข้าวแกงหมู',
          price: '45 THB',
          kcal: 420,
          image: 'https://via.placeholder.com/400x300?text=Curry+Pork'
        },
        'sushi-set': {
          name: 'เซ็ตซูชิ',
          price: '120 THB',
          kcal: 380,
          image: 'https://via.placeholder.com/400x300?text=Sushi+Set'
        },
        'caesar-salad': {
          name: 'สลัดซีซาร์',
          price: '60 THB',
          kcal: 320,
          image: 'https://via.placeholder.com/400x300?text=Caesar+Salad'
        },
        'fruit-smoothie': {
          name: 'สมูทตี้ผลไม้',
          price: '45 THB',
          kcal: 180,
          image: 'https://via.placeholder.com/400x300?text=Fruit+Smoothie'
        },
        'grilled-chicken-salad': {
          name: 'สลัดไก่ย่าง',
          price: '70 THB',
          kcal: 280,
          image: 'https://via.placeholder.com/400x300?text=Grilled+Chicken+Salad'
        },
        'khao-klook-kapi': {
          name: 'ข้าวคลุกกะปิ',
          price: '40 THB',
          kcal: 450,
          image: 'https://via.placeholder.com/400x300?text=Khao+Klook+Kapi'
        },
        'spaghetti-carbonara': {
          name: 'สปาเก็ตตีคาร์บอนารา',
          price: '80 THB',
          kcal: 550,
          image: 'https://via.placeholder.com/400x300?text=Spaghetti+Carbonara'
        },
        'fried-chicken-rice': {
          name: 'ข้าวไก่ทอด',
          price: '50 THB',
          kcal: 520,
          image: 'https://via.placeholder.com/400x300?text=Fried+Chicken+Rice'
        }
      };

      const menuResponse = await fetch(`/api/menu/${restaurantId}`);
      const databaseMenuItems = menuResponse.ok ? await menuResponse.json() : [];

      // Load menu items dynamically
      const menuGrid = document.getElementById('menu-grid');
      const menuItems = databaseMenuItems.length
        ? databaseMenuItems
        : (restaurantMenus[restaurantId] || restaurantMenus['pra-daeng']).map((dishId) => dishData[dishId]);

      menuItems.forEach((dish) => {
        if (!dish) return;

        const card = document.createElement('a');
        card.className = 'liquid-card p-[32px] group hover:scale-[1.02] transition-transform duration-300 flex flex-col gap-base cursor-pointer';
        card.href = `3.html?restaurant=${restaurantId}&dish=${dish.id}`;
        card.setAttribute('data-dish-id', dish.id);

        card.innerHTML = `
          <div class="w-full h-48 rounded-2xl overflow-hidden relative mb-base">
            <img class="object-cover w-full h-full" src="${dish.image}" alt="${dish.name}"/>
          </div>
          <div class="flex justify-between items-start">
            <h2 class="font-stats-num text-stats-num text-primary">${dish.name}</h2>
            <span class="font-stats-num text-stats-num text-primary">${dish.price} THB</span>
          </div>
          <div class="flex items-center gap-base mt-auto pt-base border-t border-outline-variant">
            <div class="flex items-center gap-2 px-3 py-1 bg-black rounded-full text-white">
              <span class="material-symbols-outlined text-sm" data-icon="local_fire_department" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
              <span class="font-label-caps text-label-caps">${dish.kcal} kcal</span>
            </div>
            <button class="ml-auto w-10 h-10 flex items-center justify-center rounded-full bg-surface border-[1.5px] border-black group-hover:bg-black group-hover:text-white transition-colors duration-300 pointer-events-none">
              <span class="material-symbols-outlined" data-icon="arrow_forward" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
            </button>
          </div>
        `;

        menuGrid.appendChild(card);
      });

      // Handle login button
      const loginBtn = document.getElementById('login-btn');
      const currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
      
      if (currentUser.email) {
        loginBtn.textContent = 'ออกจากระบบ';
        loginBtn.addEventListener('click', () => {
          localStorage.removeItem('currentUser');
          window.location.reload();
        });
      } else {
        loginBtn.addEventListener('click', () => {
          window.location.href = 'login.html';
        });
      }
    });
</script>
</body></html>
